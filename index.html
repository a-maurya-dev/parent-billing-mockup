<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OceanFriends · Parent Billing (mobile) — clickable mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root{
  --red:#B91C1C; --red-bg:#FEF2F2;
  --green:#0E9F6E; --green-bg:#EAF8F2;
  --amber:#B45309; --amber-bg:#FFF4E5;
  --navy:#163A71; --navy-bg:#EAF0FA;
  --primary:#4185F3; --primary-bg:rgba(65,133,243,.08);
  --bg:#F2F3F8; --card:#fff; --text:#1D2939; --muted:#667085; --border:#E4E7EC;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Poppins,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;background:#E9ECF3;color:var(--text);font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea,select{font:inherit}

/* ---------- page layout ---------- */
.layout{display:grid;grid-template-columns:280px 400px 1fr;gap:28px;padding:24px;min-height:100vh;align-items:start;max-width:1400px;margin:0 auto}
@media (max-width:1100px){.layout{grid-template-columns:1fr;justify-items:center}.panel,.notes{width:100%;max-width:400px}}
.panel,.notes{background:#fff;border-radius:16px;padding:18px;border:1px solid var(--border);position:sticky;top:24px}
.panel h1{font-size:16px;margin:0 0 2px}
.panel .sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.panel h3,.notes h3{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:16px 0 8px}
.jump{display:flex;flex-wrap:wrap;gap:6px}
.jump button{border:1px solid var(--border);background:#fff;border-radius:999px;padding:5px 10px;font-size:12px}
.jump button:hover{border-color:var(--primary);color:var(--primary)}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;font-size:13px}
.ctl select{border:1px solid var(--border);border-radius:8px;padding:4px 6px;font-size:12px}
.notes h2{font-size:15px;margin:0 0 6px}
.notes ul{margin:0;padding-left:18px;color:#344054;font-size:12.5px;line-height:1.6}
.notes code{background:#F2F4F7;border-radius:4px;padding:1px 4px;font-size:11.5px}

/* ---------- phone ---------- */
.phone{width:390px;height:844px;background:#0B1220;border-radius:54px;padding:12px;box-shadow:0 30px 60px rgba(16,24,40,.25);position:relative}
.screen{width:100%;height:100%;background:var(--bg);border-radius:44px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.statusbar{height:44px;flex:none;display:flex;justify-content:space-between;align-items:flex-end;padding:0 28px 6px;font-size:13px;font-weight:600}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:110px;height:30px;background:#0B1220;border-radius:20px;z-index:5}
.topbar{flex:none;display:flex;align-items:center;gap:8px;padding:6px 16px 10px;min-height:48px}
.topbar h2{font-size:18px;font-weight:600;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:36px;height:36px;border-radius:12px;border:none;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 1px 2px rgba(16,24,40,.06)}
.childbtn{display:flex;align-items:center;gap:6px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:4px 10px 4px 4px;font-size:13px;font-weight:500}
.avatar{width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:600}
.view{flex:1;overflow-y:auto;padding:0 16px 24px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.enter{animation:viewIn .2s ease-out}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.tabbar{flex:none;display:flex;justify-content:space-around;background:#fff;border-top:1px solid var(--border);padding:8px 8px 22px}
.tabbar button{border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);padding:4px 10px;border-radius:10px}
.tabbar button.on{color:var(--navy);font-weight:600}
.tabbar svg{width:22px;height:22px}

/* ---------- building blocks ---------- */
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border)}
.section-title{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:20px 2px 8px;display:flex;justify-content:space-between;align-items:center}
.section-title button{border:none;background:none;color:var(--primary);font-size:12px;font-weight:500;text-transform:none;letter-spacing:0}
.muted{color:var(--muted)} .small{font-size:12px} .xs{font-size:11px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.red{color:var(--red);background:var(--red-bg)} .pill.green{color:var(--green);background:var(--green-bg)}
.pill.amber{color:var(--amber);background:var(--amber-bg)} .pill.navy{color:var(--navy);background:var(--navy-bg)}
.pill.grey{color:#475467;background:#F2F4F7} .pill.blue{color:var(--primary);background:var(--primary-bg)}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;border:none;border-radius:12px;padding:13px 16px;font-weight:600;font-size:15px;background:var(--navy);color:#fff;transition:opacity .15s,transform .15s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--border)}
.btn.ghost{background:transparent;color:var(--primary);padding:10px}
.btn.danger{background:#fff;color:var(--red);border:1px solid #FECDCA}
.btn.sm{padding:8px 12px;font-size:13px;width:auto;border-radius:10px}
.btnrow{display:flex;gap:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--border);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;white-space:nowrap;font-weight:500}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.seg{display:flex;background:#E4E7EC;border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:none;background:none;border-radius:9px;padding:7px 6px;font-size:12.5px;font-weight:500;color:#475467}
.seg button.on{background:#fff;color:var(--navy);font-weight:600;box-shadow:0 1px 2px rgba(16,24,40,.08)}

/* balance card */
.balance{background:linear-gradient(160deg,#163A71 0%,#1F4E94 100%);color:#fff;border-radius:20px;padding:18px;position:relative;overflow:hidden}
.balance .lbl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.8;font-weight:600}
.balance .amt{font-size:34px;font-weight:600;margin:4px 0 2px;letter-spacing:-.5px}
.balance .note{font-size:12.5px;opacity:.85;margin-bottom:14px}
.balance .badge{position:absolute;top:16px;right:16px}
.balance .btn{background:#fff;color:var(--navy)}
.balance.settled{background:linear-gradient(160deg,#0E7F5A 0%,#0E9F6E 100%)}
.balance.credit{background:linear-gradient(160deg,#1F4E94 0%,#4185F3 100%)}
.balance .contact{background:rgba(255,255,255,.14);border-radius:10px;padding:10px 12px;font-size:12.5px}
.clinicname{font-weight:600;font-size:14px;margin:2px 2px 8px;display:flex;align-items:center;gap:6px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px}
.stat .k{font-size:11.5px;color:var(--muted)} .stat .v{font-size:18px;font-weight:600;margin-top:2px}
.stat .v.red{color:var(--red)} .stat .v.green{color:var(--green)}
.shortcuts{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-top:12px}
.bar{height:8px;border-radius:8px;background:#EEF0F4;overflow:hidden;margin:6px 0 4px}
.bar>i{display:block;height:100%;width:100%;border-radius:8px;background:var(--navy);transform-origin:left;transition:transform .3s ease-out}
.bar.green>i{background:var(--green)} .bar.amber>i{background:#F59E0B} .bar.red>i{background:var(--red)}
.meter{padding:10px 0;border-bottom:1px solid #F2F4F7}
.meter:last-child{border-bottom:none}
.meter .top{display:flex;justify-content:space-between;font-size:13px}
.idcard{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.idcard div{border:1px dashed #98A2B3;border-radius:10px;height:64px;display:grid;place-items:center;font-size:11px;color:var(--muted);background:#FCFCFD}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mini-stat{background:#F9FAFB;border-radius:10px;padding:8px 10px}
.mini-stat .k{font-size:11px;color:var(--muted)} .mini-stat .v{font-weight:600;font-size:14px}
.shortcut{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:500}
.shortcut svg{width:20px;height:20px;color:var(--navy)}

/* lists */
.list{background:#fff;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border:none;background:none;width:100%;text-align:left;border-bottom:1px solid #F2F4F7}
.li:last-child{border-bottom:none}
.li .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none;font-size:15px}
.li .body{flex:1;min-width:0}
.li .t{font-weight:500;font-size:13.5px}
.li .s{font-size:12px;color:var(--muted)}
.chev{color:#98A2B3;flex:none}

/* activity rows */
.month{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 2px 8px}
.row{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--border);border-radius:14px;padding:12px;margin-bottom:8px;align-items:flex-start}
.row.pending{border-style:dashed;background:#FCFCFD}
.row.failed{background:#FFFBFA;border-color:#FECDCA}
.dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none}
.dot.amber{background:#F59E0B} .dot.green{background:var(--green)} .dot.red{background:var(--red)} .dot.navy{background:var(--navy)}
.dot.pending{border:2px dashed #98A2B3;background:transparent}
.dot.half{background:linear-gradient(90deg,#F59E0B 50%,#FDE7C2 50%)}
.row .body{flex:1;min-width:0}
.row .t{font-weight:600;font-size:13.5px}
.row .s{font-size:12px;color:var(--muted);margin-top:1px}
.row .amt{font-weight:600;font-size:14px;text-align:right;white-space:nowrap}
.row .amt.ok{color:var(--green)} .row .amt.muted{color:#98A2B3} .row .amt.navy{color:var(--navy)}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:10px}
.search input{border:none;outline:none;flex:1;background:none}
.rangebar{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:8px 2px 0}
.rangebar button{border:none;background:none;color:var(--primary);font-weight:500;font-size:12px}
.footer-totals{position:sticky;bottom:-24px;margin:12px -16px -24px;background:#fff;border-top:1px solid var(--border);padding:10px 16px 14px}
.footer-totals .main{display:flex;justify-content:space-between;align-items:center;font-weight:600;width:100%;border:none;background:none;padding:0}
.footer-totals .grid{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:12.5px;margin-top:8px;color:#344054}

/* money breakdown */
.kv{display:flex;justify-content:space-between;padding:6px 0;font-size:13.5px}
.kv.total{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;font-weight:600}
.kv .neg{color:var(--green)}
.kv.big{font-size:16px}

/* bottom sheet */
.backdrop{position:absolute;inset:0;background:rgba(16,24,40,.45);opacity:0;pointer-events:none;transition:opacity .2s ease-out;z-index:20}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:88%;background:#fff;border-radius:24px 24px 0 0;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);z-index:21;display:flex;flex-direction:column}
.sheet.open{transform:none}
.sheet.closing{transition-duration:.16s}
.sheet .grab{width:40px;height:4px;background:#D0D5DD;border-radius:4px;margin:10px auto 4px;flex:none}
.sheet .sc{overflow-y:auto;padding:8px 18px 28px;scrollbar-width:none}
.sheet h3{font-size:18px;margin:4px 0 2px}
.acc{border:1px solid var(--border);border-radius:12px;margin-top:10px;overflow:hidden}
.acc>button{width:100%;display:flex;justify-content:space-between;align-items:center;border:none;background:#fff;padding:12px 14px;font-weight:600;font-size:13.5px}
.acc>.in{padding:0 14px 12px;display:none}
.acc.open>.in{display:block}
.acc.open>button .chev{transform:rotate(90deg)}
.chev{transition:transform .15s}

/* steps */
.steps{list-style:none;padding:0;margin:14px 0}
.steps li{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}
.steps li:not(:last-child)::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--border)}
.steps li.done:not(:last-child)::before{background:var(--green)}
.steps .b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none;border:2px solid var(--border);background:#fff;color:#98A2B3}
.steps li.done .b{background:var(--green);border-color:var(--green);color:#fff}
.steps li.now .b{border-color:var(--amber);color:var(--amber)}

/* forms */
.field{margin-top:12px}
.field label{display:block;font-size:12.5px;font-weight:500;margin-bottom:6px;color:#344054}
.input{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px;background:#fff;outline:none}
.input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(65,133,243,.15)}
.hosted{border:1px dashed #98A2B3;border-radius:12px;padding:12px;color:#475467;background:#FCFCFD;font-size:13px;display:flex;justify-content:space-between}
.hosted .tag{font-size:10px;color:#98A2B3;text-transform:uppercase;letter-spacing:.06em}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1.5px solid var(--border);border-radius:14px;padding:12px;background:#fff;margin-bottom:8px}
.opt.on{border-color:var(--navy);background:#F5F8FD}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #D0D5DD;flex:none;display:grid;place-items:center}
.opt.on .radio{border-color:var(--navy)}
.opt.on .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--navy)}
.opt.dashed{border-style:dashed}
.radiorow{display:flex;gap:8px;flex-wrap:wrap}
.radiorow button{border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:8px 14px;font-size:13px;font-weight:500}
.radiorow button.on{border-color:var(--navy);background:#F5F8FD;color:var(--navy)}
.stepper{display:flex;gap:6px;margin:0 0 14px}
.stepper span{flex:1;height:4px;border-radius:4px;background:#D0D5DD}
.stepper span.on{background:var(--navy)}
.info{display:flex;gap:8px;background:var(--primary-bg);color:#1E4FA8;border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:10px;line-height:1.45}
.info.warn{background:var(--amber-bg);color:var(--amber)}
.info.err{background:var(--red-bg);color:var(--red)}
.consent{font-size:11.5px;color:var(--muted);line-height:1.5;margin:12px 2px}

/* cards (payment methods) */
.ccard{border-radius:16px;padding:16px;color:#fff;background:linear-gradient(135deg,#1D2939,#344054);margin-bottom:10px}
.ccard.visa{background:linear-gradient(135deg,#163A71,#4185F3)}
.ccard.mc{background:linear-gradient(135deg,#7A2E0E,#E04F16)}
.ccard .top{display:flex;justify-content:space-between;align-items:center;font-weight:600}
.ccard .num{font-size:18px;letter-spacing:2px;margin:18px 0 6px}
.ccard .bot{display:flex;justify-content:space-between;font-size:12px;opacity:.9}
.ccard-actions{background:#fff;border:1px solid var(--border);border-radius:0 0 14px 14px;margin:-18px 0 12px;padding:22px 14px 10px}
.switch{width:42px;height:24px;border-radius:999px;background:#D0D5DD;border:none;position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--green)} .switch.on::after{transform:translateX(18px)}

/* result */
.result{text-align:center;padding:40px 8px 0}
.result .big{width:84px;height:84px;border-radius:50%;display:grid;place-items:center;margin:0 auto 16px;font-size:40px}
.result .big.ok{background:var(--green-bg);color:var(--green)}
.result .big.bad{background:var(--red-bg);color:var(--red)}
.result.pop .big{animation:pop .3s ease-out}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* toast */
.toast{position:absolute;left:16px;right:16px;bottom:96px;background:#101828;color:#fff;border-radius:12px;padding:12px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:opacity .18s,transform .18s;z-index:30;pointer-events:none}
.toast.show{opacity:1;transform:none}

/* skeleton */
.sk{background:linear-gradient(90deg,#E4E7EC 25%,#F2F4F7 50%,#E4E7EC 75%);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}
@keyframes sk{from{background-position:200% 0}to{background-position:-200% 0}}

.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.empty .em{font-size:40px;margin-bottom:8px}
.empty b{display:block;color:var(--text);font-size:15px;margin-bottom:4px}
table.mini{width:100%;border-collapse:collapse;font-size:12.5px}
table.mini td{padding:6px 0;border-bottom:1px solid #F2F4F7}
table.mini td:last-child{text-align:right}
.tl{border-left:2px solid var(--border);margin:8px 0 0 6px;padding-left:14px}
.tl .ev{position:relative;padding-bottom:12px}
.tl .ev::before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--c,#98A2B3)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="layout">

  <!-- ===== Control panel ===== -->
  <aside class="panel">
    <h1>Parent Billing — mobile</h1>
    <div class="sub">Clickable mockup, based on the clinic web Financial Account → <b>Statement</b> tab (plus Payments, Invoice and insurance data). Mock data only.</div>

    <h3>Jump to screen</h3>
    <div class="jump" id="jump"></div>

    <h3>Clinic billing settings</h3>
    <div class="ctl"><span>Convenience fee</span>
      <select id="set-fee">
        <option value="stripe">Pass-through (Stripe)</option>
        <option value="flat">Flat fee $3.00</option>
        <option value="off">Off</option>
      </select></div>
    <label class="ctl"><span>Show insurance benefits</span><input type="checkbox" id="set-insurance" checked></label>
    <label class="ctl"><span>Parents can remove cards</span><input type="checkbox" id="set-delete" checked></label>
    <label class="ctl"><span>Client invoicing on</span><input type="checkbox" id="set-invoices" checked></label>
    <label class="ctl"><span>Autopay enabled</span><input type="checkbox" id="set-autopay" checked></label>

    <h3>Scenarios</h3>
    <label class="ctl"><span>Show loading state</span><input type="checkbox" id="sc-loading"></label>
    <label class="ctl"><span>Empty account</span><input type="checkbox" id="sc-empty"></label>
    <label class="ctl"><span>Next payment fails</span><input type="checkbox" id="sc-fail"></label>
    <div style="margin-top:12px"><button class="btn secondary sm" onclick="location.reload()">Reset demo</button></div>
  </aside>

  <!-- ===== Phone ===== -->
  <div class="phone">
    <div class="screen" id="screen">
      <div class="island"></div>
      <div class="statusbar"><span>9:41</span><span>●●● 5G ▮</span></div>
      <header class="topbar" id="topbar"></header>
      <main class="view" id="view"></main>
      <nav class="tabbar" id="tabbar"></nav>
      <div class="backdrop" id="backdrop" onclick="closeSheet()"></div>
      <div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grab"></div><div class="sc" id="sheet-sc"></div></div>
      <div class="toast" id="toast" role="status"></div>
    </div>
  </div>

  <!-- ===== Design notes ===== -->
  <aside class="notes" id="notes"></aside>
</div>

const clinics = () => S.scenario.empty ? [EMPTY_CLINIC] : child().clinics;
const billable = cl => cl.items.filter(i => ['session', 'custom', 'tentative'].includes(i.kind));
const rowOut = i => r2((i.share || 0) - (i.paid || 0));            // rowOutstanding(): to_pay − patient_payment
const fullyPaid = i => i.kind !== 'tentative' && rowOut(i) <= 0.005; // sessions_due[].fully_paid
/* Row status, same as the parent web ParentStatementTable rowStatus() */
function rowStatus(i) {
  if (i.kind === 'payment') return ['Payment', 'blue'];
  if (rowOut(i) <= 0.005) return ['Paid', 'green'];
  if (i.paid > 0.005) return ['Partially paid', 'amber'];
  return ['Due', 'red'];
}

/* Numbers mirror the clinic Statement tab:
   Outstanding Amount = accountOutstanding() = server amountDue (billed lines) + not-billed-yet visit dues
   Unapplied Credit   = sum of paymentRemaining() over non-failed payments (shown separately, not subtracted)
   Totals row         = statementTotals(): Amount Charged, Paid By Payer, Patient Responsibility, Patient Paid, Outstanding */
function totals(cl) {
  const b = billable(cl);
  const charged = r2(sum(b, i => i.charged)), ins = r2(sum(b, i => i.ins)), owed = r2(sum(b, i => i.share)), paid = r2(sum(b, i => i.paid));
  const serverAmountDue = r2(sum(b.filter(i => i.kind !== 'tentative'), rowOut));
  const unbilled = r2(sum(b.filter(i => i.kind === 'tentative'), rowOut));
  const amountDue = r2(serverAmountDue + unbilled);
  const still = amountDue;
  const credit = r2(sum(cl.payments.filter(p => p.status !== 'failed'), p => p.remaining));
  const received = r2(sum(cl.payments.filter(p => p.status !== 'failed'), p => p.amount));
  const state = amountDue > 0.01 ? 'due' : amountDue < -0.01 ? 'credit' : 'settled';
  return { charged, ins, owed, paid, still, credit, amountDue, unbilled, received, state };
}

const TITLES = { home: 'Billing', activity: 'Activity', payments: 'Payments', documents: 'Documents', cards: 'Payment methods', estimates: 'Estimates',

function go(route, params = {}) { S.stack.push({ route: S.route, params: S.params }); S.route = route; S.params = params; render(); }
function back() { const p = S.stack.pop(); if (!p) return; S.route = p.route; S.params = p.params; render(); }
function tab(route) { S.stack = []; S.route = route; S.params = {}; closeSheet(true); render(); }

function render() {
  const v = document.getElementById('view');
  const isTab = TABS.some(t => t[0] === S.route);
  // top bar
  let tb = '';
  if (S.stack.length) tb += `<button class="iconbtn" aria-label="Back" onclick="back()">${BACK}</button>`;
  tb += `<h2>${TITLES[S.route] ?? ''}</h2>`;
  if (S.route === 'home' || S.route === 'activity') {
    const c = child();
    tb += `<button class="childbtn" onclick="openChildSwitcher()" aria-label="Switch child"><span class="avatar">${c.initials}</span>${c.short} ▾</button>`;
  }
  document.getElementById('topbar').innerHTML = tb;
  // body
  v.innerHTML = (SCREENS[S.route] || (() => ''))();
  v.scrollTop = 0;
  v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
  // tab bar
  const tbar = document.getElementById('tabbar');
  tbar.style.display = isTab ? 'flex' : 'none';
  tbar.innerHTML = TABS.map(([r, l, i]) => `<button class="${S.route === r ? 'on' : ''}" onclick="tab('${r}')" aria-current="${S.route === r}">${icon(i)}${l}</button>`).join('');
  renderNotes();
}

/* ============================================================

   ============================================================ */
function openSheet(html) {
  document.getElementById('sheet-sc').innerHTML = html;
  document.getElementById('sheet-sc').scrollTop = 0;
  const sh = document.getElementById('sheet');
  sh.classList.remove('closing');
  document.getElementById('backdrop').classList.add('open');
  requestAnimationFrame(() => sh.classList.add('open'));
}
function closeSheet(instant) {
  const sh = document.getElementById('sheet');
  if (!sh.classList.contains('open')) return;
  if (!instant) sh.classList.add('closing');
  sh.classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
}
let toastT;
function toast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2400);
}
function toggleAcc(el) { el.parentElement.classList.toggle('open'); }

function rowHTML(it, cur) {
  const [lab, tone] = it.kind === 'tentative' ? ['Not billed yet', 'amber'] : rowStatus(it);
  const out = rowOut(it);
  let title = it.kind === 'session' || it.kind === 'tentative' ? `${it.title} session` : it.title;
  let s1 = `${fd(it.date)} · ${it.sub || ''}`, s2 = '', amt = '', amtCls = '', dot = tone === 'green' ? 'green' : tone === 'blue' ? 'navy' : 'amber', cls = '';
  if (it.kind === 'payment') { s2 = it.desc || ''; amt = '−' + fmt(it.amount, cur); amtCls = 'ok'; }
  else if (it.kind === 'tentative') { dot = 'half'; s2 = `Estimated share ${fmt(it.share, cur)}`; amt = fmt(out, cur); }
  else {
    s2 = `Your share ${fmt(it.share, cur)} · Paid ${fmt(it.paid, cur)}`;
    amt = out > 0.005 ? fmt(out, cur) : '✓ Paid'; amtCls = out > 0.005 ? '' : 'ok';
    if (out > 0.005 && it.paid <= 0.005) dot = 'red';
  }
  return `<button class="row ${cls}" onclick="openItem('${it.id}')">
    <span class="dot ${dot}"></span>
    <span class="body"><div class="t">${title}</div><div class="s">${s1}</div>${s2 ? `<div class="s">${s2}</div>` : ''}<div style="margin-top:4px">${pill(lab, tone)}</div></span>
    <span class="amt ${amtCls}">${amt}</span>${CHEV}</button>`;
}

    <button class="shortcut" onclick="go('payments')">${icon('receipt')}Payments</button>
    <button class="shortcut" onclick="go('estimates')">${icon('est')}Estimates</button>
    ${S.settings.insurance ? `<button class="shortcut" onclick="go('benefits')">${icon('shield')}Benefits</button>` : ''}
    <button class="shortcut" onclick="openStatementSheet()">${icon('stmt')}Statement</button></div>`;

  // Things to know
  const items = attention(cl);
  h += `<div class="section-title">Things to know</div>`;
  h += items.length ? `<div class="list">${items.join('')}</div>` : `<div class="card muted small">✓ Nothing needs your attention right now.</div>`;

  // Recent
  const rows = activityRows(cl).slice(0, 3);
  h += `<div class="section-title">Recent activity <button onclick="tab('activity')">See all ›</button></div>`;
  h += rows.length ? rows.map(r => rowHTML(r, cur)).join('') : emptyBlock('🧾', 'No charges yet', 'Visits appear here once insurance has processed them, along with any other charges.');
  return h;
};

function balanceCard(cl, t) {
  const cur = cl.cur;
  if (!cl.enrolled) {
    return `<div class="balance"><span class="badge">${pill('Due', 'red')}</span><div class="lbl">Amount due</div><div class="amt">${fmt(t.amountDue, cur)}</div>
      <div class="contact">Please contact the clinic to pay this balance.</div></div>`;
  }
  const creditLine = t.credit > 0.005 ? `<div class="note">💙 ${fmt(t.credit, cur)} credit on account, received and not yet applied to a charge</div>` : '';
  if (t.state === 'due') {
    return `<div class="balance"><span class="badge">${pill('Due', 'red')}</span><div class="lbl">Outstanding amount</div><div class="amt">${fmt(t.amountDue, cur)}</div>
      <div class="note">${t.unbilled > 0.005 ? `Includes ${fmt(t.unbilled, cur)} for visits not billed yet` : 'Across processed visits and other charges'}</div>${creditLine}
      <button class="btn" onclick="startPay('balance')">Pay now</button></div>`;
  }
  if (t.state === 'credit') {
    return `<div class="balance credit"><span class="badge">${pill('Credit', 'green')}</span><div class="lbl">Outstanding amount</div><div class="amt">${fmt(-t.amountDue, cur)} CR</div>
      <div class="note">You’ve paid more than your share so far.</div>${creditLine}
      <button class="btn" onclick="startPay('balance')">Make a payment</button></div>`;
  }
  return `<div class="balance settled"><span class="badge">${pill('Paid up', 'green')}</span><div class="lbl">Outstanding amount</div><div class="amt">${fmt(0, cur)}</div>
    <div class="note">You’re all caught up.</div>${creditLine}<button class="btn" onclick="startPay('balance')">Make a payment</button></div>`;
}
const STATEMENT_NOTE = 'Shows visits insurance has finished processing, plus other charges. Visits still with insurance appear once they’re processed.';

function attention(cl) {
  const out = [], cur = cl.cur;
  const li = (ic, bg, t, s, on) => `<button class="li" onclick="${on}"><span class="ic" style="background:${bg}">${ic}</span><span class="body"><div class="t">${t}</div><div class="s">${s}</div></span>${CHEV}</button>`;
  const failed = cl.payments.filter(p => p.status === 'failed');
  if (failed.length) out.push(li('⚠️', 'var(--red-bg)', `${failed.length} payment${failed.length > 1 ? 's' : ''} failed`, `${failed[0].failure} · Tap to retry`, `go('payments',{filter:'failed'})`));
  const tent = cl.items.filter(i => i.kind === 'tentative' && rowOut(i) > 0.005);
  if (tent.length) out.push(li('⏳', 'var(--amber-bg)', `${tent.length} visit${tent.length > 1 ? 's' : ''} not billed yet · ${fmt(sum(tent, rowOut), cur)}`, 'Included in your outstanding amount; may change', `S.filter='tentative';tab('activity')`));
  if (S.settings.invoices) {
    cl.invoices.filter(i => i.status === 'overdue').forEach(i => out.push(li('📄', 'var(--red-bg)', `Invoice ${i.num} is overdue`, `${fmt(i.amount - i.paid, cur)} · was due ${fd(i.due)}`, `S.docsTab='invoices';tab('documents')`)));
    cl.invoices.filter(i => i.status === 'outstanding' && daysAgo(i.issued) <= 14).forEach(i => out.push(li('📄', 'var(--primary-bg)', `New invoice ${i.num}`, `${fmt(i.amount - i.paid, cur)} · due ${fd(i.due)}`, `S.docsTab='invoices';tab('documents')`)));
  }
  cl.estimates.filter(g => g.owed > 0).forEach(g => out.push(li('🧾', 'var(--navy-bg)', `Estimate: ${fmt(g.owed, cur)} still owed`, g.name, `go('estimate',{id:'${g.id}'})`)));
  if (S.settings.insurance && !S.scenario.empty) {
    benefitAlerts(child().benefits).forEach(a => out.push(li('🛡️', a.tone === 'red' ? 'var(--red-bg)' : 'var(--amber-bg)', a.title, a.sub, `go('benefits')`)));
  }
  cl.payments.filter(p => p.refundStatus === 'processing').forEach(p => out.push(li('↩️', 'var(--amber-bg)', 'Refund in progress', methodLabel(p), `openItem('${p.id}')`)));
  return out;
}

/* ---------- Activity (= clinic Statement tab) ---------- */
SCREENS.activity = () => {
  if (S.scenario.loading) return skeleton('list');
  const cl = clinic();
  const F = [['all', 'All'], ['unpaid', 'Unpaid'], ['paid', 'Paid'], ['tentative', 'Not billed yet']];
  let h = `<div class="search">🔍<input placeholder="Search item, therapy, description…" value="${S.search}" oninput="S.search=this.value;refreshActivity()" aria-label="Search statement"></div>`;
  h += `<div class="chips">${F.map(([k, l]) => `<button class="chip ${S.filter === k ? 'on' : ''}" onclick="S.filter='${k}';render()">${l}</button>`).join('')}</div>`;
  const rl = { '30': 'Last 30 days', '90': 'Last 3 months', 'year': 'This year', 'all': 'All time' }[S.range];
  h += `<div class="rangebar"><span>${rl}</span><button onclick="openRangeSheet()">Change</button></div>`;
  h += `<div class="info" style="margin-top:8px">ℹ️ <span>${STATEMENT_NOTE}</span></div>`;
  h += `<div id="act-list">${activityList(cl)}</div>`;
  return h;
};
function refreshActivity() { document.getElementById('act-list').innerHTML = activityList(clinic()); }
function activityList(cl) {
  const cur = cl.cur, q = S.search.trim().toLowerCase();
  let rows = activityRows(cl);
  const minDate = S.range === 'all' ? '0000' : S.range === 'year' ? '2026-01-01' : (() => { const d = dt(TODAY); d.setDate(d.getDate() - +S.range); return d.toISOString().slice(0, 10); })();
  rows = rows.filter(r => r.date >= minDate);
  rows = rows.filter(r => {
    switch (S.filter) {
      case 'unpaid': return r.kind !== 'payment' && !fullyPaid(r);   // Statement "Unpaid" (fully_paid false)
      case 'paid': return fullyPaid(r);                               // Statement "Paid"
      case 'tentative': return r.kind === 'tentative';
      default: return true;
    }
  });
  if (q) rows = rows.filter(r => [r.title, r.sub, r.desc].filter(Boolean).join(' ').toLowerCase().includes(q));
  if (!cl.items.length) return emptyBlock('🧾', 'No charges yet', 'Visits appear here once insurance has processed them, along with any other charges.');
  if (!rows.length) return `<div class="empty"><div class="em">🔎</div><b>Nothing matches these filters</b><button class="btn secondary sm" style="margin:10px auto 0" onclick="S.filter='all';S.search='';S.range='all';render()">Clear filters</button></div>`;
  let h = '', m = '';
  rows.forEach(r => {
    const mm = fd(r.date, { month: 'long', year: 'numeric' });
    if (mm !== m) { h += `<div class="month">${mm}</div>`; m = mm; }
    h += rowHTML(r, cur);
  });
  // Statement "Total" row: statementTotals() over the lines in view
  const b = rows.filter(r => r.kind !== 'payment');
  const tc = { charged: sum(b, i => i.charged), ins: sum(b, i => i.ins), share: sum(b, i => i.share), paid: sum(b, i => i.paid), out: sum(b, rowOut) };
  h += `<div class="footer-totals"><button class="main" onclick="S.footerOpen=!S.footerOpen;refreshActivity()" aria-expanded="${S.footerOpen}">
      <span>Total still due (${b.length} lines)</span><span>${fmt(r2(tc.out), cur)} ${S.footerOpen ? '▾' : '▴'}</span></button>
    ${S.footerOpen ? `<div class="grid"><span>Clinic charges</span><b>${fmt(tc.charged, cur)}</b><span>Insurance paid</span><b>${fmt(tc.ins, cur)}</b>
      <span>Your share</span><b>${fmt(tc.share, cur)}</b><span>You paid</span><b>${fmt(tc.paid, cur)}</b><span>Still due</span><b>${fmt(r2(tc.out), cur)}</b></div>` : ''}</div>`;
  return h;
}
function openRangeSheet() {
  const o = [['30', 'Last 30 days'], ['90', 'Last 3 months'], ['year', 'This year'], ['all', 'All time']];
  openSheet(`<h3>Date range</h3><div style="margin-top:12px">${o.map(([k, l]) => `<button class="opt ${S.range === k ? 'on' : ''}" onclick="S.range='${k}';closeSheet();render()"><span class="radio"></span>${l}</button>`).join('')}</div>`);
}

/* ---------- Detail sheets (from the Statement tab popups) ---------- */
function openItem(id) {
  const cl = clinic();
  const it = cl.items.find(x => x.id === id);
  if (it) {
    if (it.kind === 'tentative') return openSheet(tentativeSheet(it, cl));
    if (it.kind === 'payment') return openSheet(paymentLineSheet(it, cl));
    return openSheet(sessionSheet(it, cl));
  }
  const p = cl.payments.find(x => x.id === id);
  if (p) openSheet(paymentSheet(p, cl));
}
const CLAIM_TONE = { paid: ['green', 'Processed by insurance'], submitted: ['blue', 'Sent to insurance'], reviewing: ['grey', 'Insurance reviewing'], rejected: ['red', 'Clinic is following up with insurance'], returnToTherapist: ['amber', 'Clinic is reviewing'] };
const paymentsTable = (ps, cur) => `<table class="mini">${ps.map(a => `<tr><td>${fd(a.date)} · ${a.mode}${a.desc ? `<div class="muted xs">${a.desc}</div>` : ''}</td><td>${fmt(a.amt, cur)}</td></tr>`).join('')}</table>`;

function sessionSheet(it, cl) {
  const cur = cl.cur, due = rowOut(it), isS = it.kind === 'session';
  const adj = isS ? r2(it.charged - it.ins - it.share) : 0;
  const [lab, tone] = rowStatus(it);
  let h = `<h3>${isS ? it.title + ' session' : it.title}</h3><div class="muted small">${fdy(it.date)} · ${it.sub || ''} · ${cl.name}</div>
    <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">${pill(lab, tone)}${!isS ? pill('Other charge', 'grey') : ''}</div>`;
  if (isS && it.era) {
    const [t, txt] = CLAIM_TONE[it.claimStatus] || ['grey', 'Insurance update'];
    h += `<div class="muted xs" style="margin-top:6px">${pill(txt, t)} on ${fdy(it.era)}</div>`;
  }
  h += `<div class="section-title">${isS ? 'How this was billed' : 'Charge'}</div><div class="card" style="padding:8px 14px">`;
  if (isS) {
    h += `<div class="kv"><span>Clinic charge</span><span>${fmt(it.charged, cur)}</span></div>
          <div class="kv"><span>Insurance paid</span><span class="neg">−${fmt(it.ins, cur)}</span></div>
          ${adj > 0.005 ? `<div class="kv"><span>Insurance adjustment</span><span class="neg">−${fmt(adj, cur)}</span></div>` : ''}
          <div class="kv total"><span>Your share</span><span>${fmt(it.share, cur)}</span></div>`;
  } else {
    h += `<div class="kv"><span>${it.sub || 'Charge'}</span><span>${fmt(it.share, cur)}</span></div>`;
  }
  h += `<div class="kv"><span>You paid</span><span class="neg">−${fmt(it.paid, cur)}</span></div>
        <div class="kv total big"><span>Still due</span><span style="color:${due > 0.005 ? 'var(--red)' : 'var(--green)'}">${fmt(due, cur)}</span></div></div>`;
  if (it.payments?.length) {
    h += `<div class="acc open"><button onclick="toggleAcc(this)">Your payments on this visit (${it.payments.length}) ${CHEV}</button><div class="in">${paymentsTable(it.payments, cur)}</div></div>`;
  }
  if (it.prEdits?.length) {
    h += `<div class="acc"><button onclick="toggleAcc(this)">Changes to your share (${it.prEdits.length}) ${CHEV}</button><div class="in"><table class="mini">
      ${it.prEdits.map(c => `<tr><td>${fd(c.date)} · ${c.service}${c.reason ? `<div class="muted xs">${c.reason}</div>` : ''}</td><td>${fmt(c.from, cur)} → <b>${fmt(c.to, cur)}</b></td></tr>`).join('')}</table></div></div>`;
  }
  if (isS && S.settings.insurance) h += `<button class="btn ghost sm" style="padding-left:0;margin-top:6px" onclick="closeSheet(true);go('benefits')">See your plan benefits ›</button>`;
  h += `<div style="display:grid;gap:8px;margin-top:12px">
    ${due > 0.005 && cl.enrolled ? `<button class="btn" onclick="startPay('visit','${it.id}')">Pay ${fmt(due, cur)}</button>` : ''}
    <button class="btn secondary" onclick="askClinic('${(isS ? it.title + ' session' : it.title)} on ${fd(it.date)}')">Ask the clinic about this</button></div>`;
  return h;
}

function tentativeSheet(it, cl) {
  const cur = cl.cur, due = rowOut(it);
  return `<h3>${it.title} session</h3><div class="muted small">${fdy(it.date)} · ${cl.name}</div>
    <div style="margin-top:8px">${pill('Not billed yet', 'amber')}</div>
    <div class="info warn">⏳ <span>This visit hasn’t been billed to insurance yet. It’s included in your outstanding amount, and the amount may change.</span></div>
    <div class="section-title">Charges</div><div class="card" style="padding:6px 14px"><table class="mini">
      ${it.charges.map(c => `<tr><td>${c.type} · ${fd(c.date)}</td><td>${fmt(c.amt, cur)}</td></tr>`).join('')}</table></div>
    <div class="section-title">Payments applied</div><div class="card" style="padding:6px 14px">${it.payments.length ? paymentsTable(it.payments, cur) : '<div class="muted small" style="padding:6px 0">No payments applied yet.</div>'}</div>
    <div class="card" style="padding:8px 14px;margin-top:10px">
      <div class="kv"><span>Charged</span><span>${fmt(it.share, cur)}</span></div>
      <div class="kv"><span>Paid</span><span class="neg">−${fmt(it.paid, cur)}</span></div>
      <div class="kv total"><span>Still due</span><span>${fmt(due, cur)}</span></div></div>
    ${it.chargeHistory?.length ? `<div class="acc"><button onclick="toggleAcc(this)">Charge history (${it.chargeHistory.length}) ${CHEV}</button><div class="in"><table class="mini">
      ${it.chargeHistory.map(c => `<tr><td>${fd(c.date)} · ${c.action}</td><td>${c.prev == null ? '—' : fmt(c.prev, cur)} → <b>${fmt(c.next, cur)}</b></td></tr>`).join('')}</table></div></div>` : ''}
    ${due > 0.005 && cl.enrolled ? `<button class="btn" style="margin-top:16px" onclick="startPay('visit','${it.id}')">Pay ${fmt(due, cur)}</button>` : ''}`;
}

function paymentLineSheet(it, cl) {
  return `<h3>Payment · ${fmt(it.amount, cl.cur)}</h3><div class="muted small">${fdy(it.date)} · ${it.sub || ''}</div>
    <div style="margin-top:8px">${pill('Payment', 'blue')}</div>
    <div class="info">ℹ️ <span>A payment recorded on your statement. See Payments for receipts and where it was applied.</span></div>
    <button class="btn secondary" style="margin-top:14px" onclick="closeSheet(true);go('payments')">Open Payments</button>`;
}

function paymentSheet(p, cl) {
  const cur = cl.cur, rf = refundOf(p);
  let h = `<h3>${p.status === 'failed' ? 'Payment failed' : 'Payment'} · ${fmt(p.amount, cur)}</h3>
    <div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">${payStatus(p)}${rf ? pill('Refunded ' + fmt(rf, cur), 'red') : ''}</div>
    <div class="card" style="padding:8px 14px;margin-top:12px">
      <div class="kv"><span class="muted">Date</span><span>${fdy(p.date)}</span></div>
      <div class="kv"><span class="muted">Paid with</span><span>${methodLabel(p)}</span></div>
      ${p.desc ? `<div class="kv"><span class="muted">Note</span><span>${p.desc}</span></div>` : ''}
      <div class="kv"><span class="muted">Clinic</span><span>${cl.name}</span></div>
      ${p.gfe ? `<div class="kv"><span class="muted">Applied to estimate</span><span>${p.gfe}</span></div>` : ''}
      ${p.status !== 'failed' && p.remaining > 0.005 ? `<div class="kv"><span class="muted">Not applied yet</span><span style="color:var(--navy)">${fmt(p.remaining, cur)}</span></div>` : ''}
    </div>`;
  if (p.status === 'failed') {
    h += `<div class="info err">⚠️ <span>${p.failure}</span></div>
      ${cl.enrolled ? `<button class="btn" style="margin-top:16px" onclick="startPay('retry','${p.id}')">Try again</button>` : ''}`;
    return h;
  }
  h += `<div class="btnrow" style="margin-top:12px">
    ${p.receipt ? `<button class="btn secondary" onclick="toast('Opening receipt PDF…')">${icon('receipt', 18)} Receipt</button>` : ''}
    ${p.alloc?.length ? `<button class="btn secondary" onclick="openSheet(allocationSheet(clinic().payments.find(x=>x.id==='${p.id}'), clinic()))">Where it went</button>` : ''}</div>`;
  if (p.history?.length) {
    const col = { Original: '#389e0d', Edited: '#096dd9', Refunded: '#cf1322' };
    h += `<div class="section-title">Refund timeline</div><div class="tl">${p.history.map(e => `<div class="ev" style="--c:${col[e.type]}">
      <b class="small">${e.type}</b> · <span class="small">${fmt(e.amount, cur)}${e.diff ? ` (${e.diff > 0 ? '+' : '−'}${fmt(Math.abs(e.diff), cur)})` : ''}</span>
      <div class="muted xs">${fdy(e.date)}${e.processed ? ` · Refunded to card on ${fd(e.processed)}` : ''}</div></div>`).join('')}</div>
      ${p.feeCharged ? `<div class="info">ℹ️ <span>Convenience fees aren’t refunded.</span></div>` : ''}`;
  }
  return h;
}

function allocationSheet(p, cl) {
  const cur = cl.cur;
  return `<h3>Where your payment went</h3><div class="muted small">${fmt(p.amount, cur)} · ${fdy(p.date)} · ${methodLabel(p)}</div>
    ${p.alloc.map(a => `<div class="card" style="margin-top:10px;padding:10px 14px">
      <div style="font-weight:600;font-size:13px">${a.desc}</div><div class="muted xs">Visit on ${fdy(a.dos)}</div>
      <div class="kv small"><span>Billed</span><span>${fmt(a.billed, cur)}</span></div>
      <div class="kv small"><span>Insurance paid</span><span>${fmt(a.ins, cur)}</span></div>
      <div class="kv small"><span>Your share</span><span>${fmt(a.share, cur)}</span></div>
      <div class="kv small"><span><b>This payment</b></span><span><b style="color:var(--green)">${fmt(a.thisPay, cur)}</b></span></div>
      ${a.other ? `<div class="kv small"><span>Other payments</span><span>${fmt(a.other, cur)}</span></div>` : ''}
      <div class="kv small total"><span>Still due on this visit</span><span>${fmt(a.bal, cur)}</span></div></div>`).join('')}
    <button class="btn secondary" style="margin-top:14px" onclick="toast('Payment allocation report shared as PDF')">Share as PDF</button>`;
}

function askClinic(subject) {
  openSheet(`<h3>Ask ${clinic().name}</h3><div class="field"><label>Subject</label><input class="input" value="Question about ${subject}"></div>
    <div class="field"><label>Message</label><textarea class="input" rows="4" placeholder="Type your question…"></textarea></div>
    <button class="btn" style="margin-top:14px" onclick="closeSheet();toast('Message sent to ${clinic().name}')">Send</button>`);
}

/* ---------- Payments ---------- */
SCREENS.payments = () => {
  const cl = clinic(), cur = cl.cur, t = totals(cl);
  if (S.params.filter) { S.payFilter = S.params.filter; S.params.filter = null; }
  const F = [['all', 'All'], ['applied', 'Applied'], ['partial', 'Partly applied'], ['unapplied', 'Not applied'], ['failed', 'Failed'], ['refunded', 'Refunded']];
  let ps = cl.payments.slice().sort((a, b) => b.date.localeCompare(a.date));
  if (S.payFilter === 'refunded') ps = ps.filter(p => refundOf(p) > 0);
  else if (S.payFilter !== 'all') ps = ps.filter(p => p.status === S.payFilter);
  let h = `<div class="card" style="display:flex;justify-content:space-between;padding:12px 14px;margin-bottom:10px">
    <div><div class="muted xs">Received</div><b>${fmt(t.received, cur)}</b></div><div style="text-align:right"><div class="muted xs">Credit on account</div><b style="color:var(--navy)">${fmt(t.credit, cur)}</b></div></div>`;
  h += `<div class="chips">${F.map(([k, l]) => `<button class="chip ${S.payFilter === k ? 'on' : ''}" onclick="S.payFilter='${k}';render()">${l}</button>`).join('')}</div><div style="height:8px"></div>`;
  if (!cl.payments.length) return h + emptyBlock('💳', 'No payments yet', 'Payments you make will show up here with receipts.');
  if (!ps.length) return h + `<div class="empty"><b>No payments match this filter</b></div>`;
  h += ps.map(p => {
    const rf = refundOf(p);
    return `<div class="card" style="margin-bottom:8px;${p.status === 'failed' ? 'background:#FFFBFA;border-color:#FECDCA' : ''}">
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:16px">${fmt(p.amount, cur)}</b>
        <span style="display:flex;gap:4px">${rf ? pill('Refunded ' + fmt(rf, cur), 'red') : ''}${payStatus(p)}</span></div>
      <div class="muted small">${fdy(p.date)} · ${methodLabel(p)}</div>
      ${p.desc ? `<div class="small" style="margin-top:2px">“${p.desc}”</div>` : ''}
      ${p.status === 'failed' ? `<div class="small" style="color:var(--red);margin-top:4px">${p.failure}</div>` : ''}
      <div class="btnrow" style="margin-top:10px">
        ${p.status === 'failed' ? (cl.enrolled ? `<button class="btn sm" onclick="startPay('retry','${p.id}')">Try again</button>` : '') :
          `${p.receipt ? `<button class="btn secondary sm" onclick="toast('Opening receipt PDF…')">Receipt</button>` : ''}
           ${p.alloc?.length ? `<button class="btn secondary sm" onclick="openSheet(allocationSheet(clinic().payments.find(x=>x.id==='${p.id}'), clinic()))">Where it went</button>` : ''}`}
        <button class="btn ghost sm" onclick="openItem('${p.id}')">Details ›</button></div></div>`;
  }).join('');
  return h;
};

/* ---------- Documents ---------- */
SCREENS.documents = () => {
  const cl = clinic(), cur = cl.cur;
  const tabs = [S.settings.invoices && ['invoices', 'Invoices'], ['statements', 'Statements'], ['superbills', 'Superbills']].filter(Boolean);
  if (!tabs.find(t => t[0] === S.docsTab)) S.docsTab = tabs[0][0];

function meter(label, total, remaining, kind) {
  const met = r2(total - remaining), pct = total > 0 ? Math.min(1, met / total) : 0;

  return `<div class="meter"><div class="top"><span>${label}</span><span class="small">${txt}</span></div>
    <div class="bar ${tone}" role="progressbar" aria-valuenow="${Math.round(pct * 100)}" aria-valuemin="0" aria-valuemax="100" aria-label="${label}"><i style="transform:scaleX(${pct})"></i></div></div>`;
}

function startPay(source, ref) {
  closeSheet(true);
  const cl = clinic(), t = totals(cl);
  let max = 0, label = 'Outstanding amount', prefill = null;
  if (source === 'balance') { max = Math.max(t.amountDue, 0); }
  else if (source === 'visit') { const it = cl.items.find(i => i.id === ref); max = it.share - it.paid; label = `${it.title} · ${fd(it.date)}`; }
  else if (source === 'invoice') { const inv = cl.invoices.find(i => i.num === ref); max = inv.amount - inv.paid; label = `Invoice ${inv.num}`; }
  else if (source === 'estimate') { const g = cl.estimates.find(e => e.id === ref); max = g.owed; label = `Estimate · ${g.name}`; }
  else if (source === 'retry') { const p = cl.payments.find(x => x.id === ref); max = Math.max(t.amountDue, 0); prefill = p.amount; label = 'Outstanding amount'; }
  max = r2(max);
  const def = child().cards.find(k => k.isDefault) || child().cards[0];
  S.pay = { source, ref, max, label, mode: prefill ? 'other' : max > 0 ? 'full' : 'other', amount: prefill ?? (max > 0 ? max : 0), note: '',
            cardId: def ? def.id : 'new', newCard: { hsa: null, type: null, save: true }, busy: false };
  go('pay-amount');
}
const stepper = n => `<div class="stepper">${[0, 1, 2].map(i => `<span class="${i <= n ? 'on' : ''}"></span>`).join('')}</div>`;

SCREENS['pay-amount'] = () => {
  const cl = clinic(), cur = cl.cur, P = S.pay;
  return `${stepper(0)}<div class="muted small">Pay ${cl.name}</div>
    <div class="card" style="margin-top:8px;display:flex;justify-content:space-between;align-items:center"><span class="small">${P.label}</span><b style="font-size:18px">${fmt(P.max, cur)}</b></div>
    <div style="margin-top:12px">
      ${P.max > 0 ? `<button class="opt ${P.mode === 'full' ? 'on' : ''}" onclick="S.pay.mode='full';S.pay.amount=S.pay.max;render()"><span class="radio"></span><span style="flex:1">Pay in full</span><b>${fmt(P.max, cur)}</b></button>` : ''}
      <button class="opt ${P.mode === 'other' ? 'on' : ''}" onclick="S.pay.mode='other';render();document.getElementById('amt').focus()"><span class="radio"></span><span style="flex:1">Other amount</span></button>
    </div>
    ${P.mode === 'other' ? `<div class="field"><label for="amt">Amount (${cur})</label><input id="amt" class="input" inputmode="decimal" placeholder="0.00" value="${P.amount || ''}" oninput="onAmt(this)"></div>
      <div class="muted xs" id="amt-hint" style="margin-top:6px">${P.amount > P.max && P.max > 0 ? 'Anything over the amount due becomes credit on your account.' : ''}</div>` : ''}
    <div class="field"><label>Note (optional)</label><input class="input" placeholder="e.g. November sessions" value="${P.note}" oninput="S.pay.note=this.value"></div>
    <button class="btn" id="amt-next" style="margin-top:20px" ${P.amount > 0 ? '' : 'disabled'} onclick="go('pay-card')">Continue</button>`;
};
function onAmt(el) {
  let v = el.value.replace(/[^0-9.]/g, ''); const parts = v.split('.');
  if (parts.length > 2) v = parts[0] + '.' + parts.slice(1).join('');
  if (parts[1]?.length > 2) v = parts[0] + '.' + parts[1].slice(0, 2);
  el.value = v; S.pay.amount = r2(parseFloat(v) || 0);
  document.getElementById('amt-next').disabled = !(S.pay.amount > 0);
  document.getElementById('amt-hint').textContent = S.pay.amount > S.pay.max && S.pay.max > 0 ? 'Anything over the amount due becomes credit on your account.' : '';
}
function selectedCard() {
  const P = S.pay;
  if (P.cardId === 'new') return { brand: 'Visa', last4: '4242', hsa: P.newCard.hsa === true, type: P.newCard.type || 'credit', isNew: true };
  return child().cards.find(k => k.id === P.cardId);
}
function feeFor(amount, card) {
  const st = S.settings;
  if (st.fee === 'off') return { applies: false, fee: 0, exempt: false };
  const exempt = card.hsa || st.blocked.includes(card.type);
  if (exempt) return { applies: true, fee: 0, exempt: true };
  const fee = st.fee === 'stripe' ? (amount + 0.30) / 0.971 - amount : st.flat;
  return { applies: true, fee: r2(fee), exempt: false };
}

      <span style="display:flex;gap:4px;flex-direction:column;align-items:flex-end">${k.isDefault ? pill('Default', 'blue') : ''}${k.hsa ? pill('HSA/FSA', 'green') : ''}</span></button>`).join('');
  h += `<button class="opt dashed ${P.cardId === 'new' ? 'on' : ''}" onclick="S.pay.cardId='new';render()"><span class="radio"></span><span style="flex:1;font-weight:500">+ Use a new card</span></button>`;
  if (P.cardId === 'new') {
    h += `<div class="card" style="margin-top:4px">
      <div class="field" style="margin-top:0"><label>Card number</label><div class="hosted"><span>4242 4242 4242 4242</span><span class="tag">secure field</span></div></div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="field"><label>Expiry</label><div class="hosted"><span>12 / 29</span></div></div>
        <div class="field"><label>CVC</label><div class="hosted"><span>•••</span></div></div></div>
      ${feeOn ? `<div class="field"><label>Is this an HSA or FSA card?</label><div class="radiorow">
          <button class="${P.newCard.hsa === true ? 'on' : ''}" onclick="S.pay.newCard.hsa=true;render()">Yes</button>
          <button class="${P.newCard.hsa === false ? 'on' : ''}" onclick="S.pay.newCard.hsa=false;render()">No</button></div></div>
        <div class="field"><label>Card type</label><div class="radiorow">
          ${['credit', 'debit', 'prepaid'].map(t => `<button class="${P.newCard.type === t ? 'on' : ''}" onclick="S.pay.newCard.type='${t}';render()">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div></div>` : ''}
      <div class="kv" style="margin-top:8px"><span class="small">Save this card for next time</span><button class="switch ${P.newCard.save ? 'on' : ''}" role="switch" aria-checked="${P.newCard.save}" onclick="S.pay.newCard.save=!S.pay.newCard.save;render()"></button></div>
    </div>`;
  }
  if (feeOn) h += `<div class="info">ℹ️ <span>A convenience fee applies to card payments. <b>HSA/FSA, debit and prepaid cards are exempt.</b></span></div>`;
  h += `<button class="btn" style="margin-top:18px" ${need ? 'disabled' : ''} onclick="go('pay-review')">Continue</button>`;
  if (need) h += `<div class="muted xs" style="text-align:center;margin-top:6px">Answer the HSA/FSA and card type questions to continue.</div>`;
  return h;
};
SCREENS['pay-review'] = () => {
  const cl = clinic(), cur = cl.cur, P = S.pay, card = selectedCard(), f = feeFor(P.amount, card);
  const total = r2(P.amount + f.fee);
  const consent = S.settings.consent || `By providing your card information, you allow ${cl.name} to charge your card for future payments in accordance with their terms.`;
  return `${stepper(2)}<div class="card" style="padding:8px 14px">
      <div class="kv"><span class="muted">Paying</span><span>${cl.name}</span></div>
      <div class="kv"><span class="muted">For</span><span>${P.label}</span></div>
      ${P.note ? `<div class="kv"><span class="muted">Note</span><span>${P.note}</span></div>` : ''}
      <div class="kv"><span class="muted">Card</span><span>${card.brand} •${card.last4}${card.hsa ? ' · HSA/FSA' : ''}</span></div></div>
    <div class="card" style="padding:8px 14px;margin-top:10px">
      <div class="kv"><span>Payment</span><span>${fmt(P.amount, cur)}</span></div>
      ${f.applies ? `<div class="kv"><span>Convenience fee</span><span>${f.exempt ? pill('Exempt', 'green') : fmt(f.fee, cur)}</span></div>` : ''}
      <div class="kv total big"><span>Total</span><span>${fmt(total, cur)}</span></div></div>
    <div class="consent">${consent}</div>
    <button class="btn" id="paybtn" ${P.busy ? 'disabled' : ''} onclick="submitPay()">${P.busy ? 'Processing…' : 'Pay ' + fmt(total, cur)}</button>`;
};
function submitPay() {
  S.pay.busy = true; render();
  setTimeout(completePay, reduced ? 200 : 1100);
}
function completePay() {
  const cl = clinic(), ch = child(), P = S.pay, card = selectedCard(), f = feeFor(P.amount, card);
  const id = 'p' + Date.now();
  if (S.scenario.failPay) {
    cl.payments.unshift({ id, date: TODAY, amount: P.amount, method: card.brand, last4: card.last4, status: 'failed', failure: 'Card declined — do not honor', remaining: 0 });
    S.scenario.failPay = false; document.getElementById('sc-fail').checked = false;
    S.result = { ok: false, amount: P.amount, msg: 'Your card was declined (do not honor). No money was taken.' };
  } else {
    if (card.isNew && P.newCard.save) ch.cards.push({ id: 'k' + Date.now(), brand: card.brand, last4: card.last4, exp: '12/29', type: card.type, hsa: card.hsa, isDefault: !ch.cards.length });
    const pay = { id, date: TODAY, amount: P.amount, method: card.brand, last4: card.last4, desc: P.note, receipt: true, feeCharged: f.fee > 0, alloc: [] };
    if (P.source === 'estimate') {
      const g = cl.estimates.find(e => e.id === P.ref); const x = Math.min(g.owed, P.amount);
      g.applied = r2(g.applied + x); g.owed = r2(g.owed - x); pay.gfe = g.name; pay.status = 'applied'; pay.remaining = r2(P.amount - x);
    } else applyPayment(cl, pay, P.source === 'visit' ? P.ref : null);
    cl.payments.unshift(pay);
    S.result = { ok: true, amount: r2(P.amount + f.fee), card: `${card.brand} •${card.last4}`, payId: id };
  }
  S.stack = []; S.route = 'pay-result'; S.params = {}; render();
}
/* Auto-apply to the target visit first, then oldest dues (mirrors server payment application) */
function applyPayment(cl, pay, firstId) {
  let left = pay.amount;
  const b = billable(cl).slice().sort((a, b) => a.date.localeCompare(b.date));
  if (firstId) b.sort((a, b) => (a.id === firstId ? -1 : b.id === firstId ? 1 : 0));
  for (const i of b) {
    const due = r2(i.share - i.paid); if (due <= 0.005) continue;
    const x = r2(Math.min(due, left)); const before = i.paid;
    i.paid = r2(i.paid + x); (i.payments ||= []).push({ date: TODAY, amt: x, mode: 'Card', desc: `${pay.method} •${pay.last4}` });
    pay.alloc.push({ dos: i.date, desc: `${i.title}${i.sub ? ' · ' + i.sub : ''}`, billed: i.charged || i.share, ins: i.ins || 0, share: i.share, thisPay: x, other: before, bal: r2(i.share - i.paid) });
    left = r2(left - x); if (left <= 0.005) break;
  }
  pay.remaining = Math.max(0, left);
  pay.status = left <= 0.005 ? 'applied' : left < pay.amount ? 'partial' : 'unapplied';
}
SCREENS['pay-result'] = () => {
  const R = S.result, cur = clinic().cur;
  if (R.ok) return `<div class="result pop"><div class="big ok">✓</div><h2 style="margin:0">Payment successful</h2>
      <div class="muted" style="margin-top:6px">${fmt(R.amount, cur)} · ${R.card} · ${fdy(TODAY)}</div>
      <div class="muted small" style="margin-top:4px">${clinic().name}</div></div>
    <div style="display:grid;gap:8px;margin-top:32px">
      <button class="btn secondary" onclick="toast('Opening receipt PDF…')">${icon('receipt', 18)} View receipt</button>
      <button class="btn secondary" onclick="openSheet(allocationSheet(clinic().payments.find(x=>x.id==='${R.payId}'), clinic()))">Where it went</button>
      <button class="btn" onclick="tab('home')">Done</button></div>`;
  return `<div class="result pop"><div class="big bad">✕</div><h2 style="margin:0">Payment didn’t go through</h2>
      <div class="muted" style="margin-top:6px">${R.msg}</div></div>
    <div style="display:grid;gap:8px;margin-top:32px">
      <button class="btn" onclick="S.pay.busy=false;S.stack=[{route:'home',params:{}},{route:'pay-amount',params:{}}];S.route='pay-card';render()">Try another card</button>
      <button class="btn secondary" onclick="tab('home')">Cancel</button></div>`;
};

function openChildSwitcher() {
  openSheet(`<h3>Whose billing?</h3><div style="margin-top:12px">${Object.entries(DATA).map(([k, c]) => {
    const t = totals(c.clinics[0]);
    return `<button class="opt ${S.child === k ? 'on' : ''}" onclick="S.child='${k}';S.clinicIdx=0;closeSheet();tab(S.route==='activity'?'activity':'home')">
      <span class="avatar">${c.initials}</span><span style="flex:1"><b class="small">${c.name}</b><div class="muted xs">${c.clinics.length} clinic${c.clinics.length > 1 ? 's' : ''}</div></span>
      ${t.state === 'due' ? pill(fmt(t.amountDue, c.clinics[0].cur) + ' due', 'red') : t.state === 'credit' ? pill('Credit', 'green') : pill('Paid up', 'green')}</button>`;
  }).join('')}</div>`);
}
function skeleton(kind) {
  const b = (h, mt = 10) => `<div class="sk" style="height:${h}px;margin-top:${mt}px"></div>`;
  if (kind === 'home') return b(16, 0) + b(170) + `<div class="stats">${b(64, 0)}${b(64, 0)}${b(64, 0)}${b(64, 0)}</div>` + b(60, 20) + b(60) + b(60);
  return b(42, 0) + b(30) + [1, 2, 3, 4, 5].map(() => b(72)).join('');
}
const emptyBlock = (em, t, s) => `<div class="empty"><div class="em">${em}</div><b>${t}</b><div class="small">${s}</div></div>`;
